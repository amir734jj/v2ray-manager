services:
  init:
    build:
      context: .
      dockerfile: generator/Dockerfile
    restart: "no"
    environment:
      - V2RAY_UUID=${V2RAY_UUID}
      - V2RAY_HOST=${V2RAY_HOST:-ws.hesamian.com}
      - V2RAY_GRPC_HOST=${V2RAY_GRPC_HOST:-grpc.hesamian.com}
      - FTP_HOST=${FTP_HOST}
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
      - FTP_PATH=${FTP_PATH}
    volumes:
      - v2ray-cfg:/cfg

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: always
    labels:
      - "traefik.http.services.https-2-${COOLIFY_RESOURCE_UUID:?COOLIFY_RESOURCE_UUID is required}-gateway-3e21.loadbalancer.server.scheme=h2c"
      - "traefik.http.services.https-3-${COOLIFY_RESOURCE_UUID:?COOLIFY_RESOURCE_UUID is required}-gateway-3e21.loadbalancer.server.scheme=h2c"
    environment:
      - GATEWAY_TRUST_CLOUDFLARE_HEADERS=${GATEWAY_TRUST_CLOUDFLARE_HEADERS:-false}
    depends_on:
      v2ray:
        condition: service_healthy
    expose:
      - "53217"
      - "53317"
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  v2ray:
    build:
      context: .
      dockerfile: v2ray/Dockerfile
      pull: true
    pull_policy: build
    restart: always
    depends_on:
      init:
        condition: service_completed_successfully
    expose:
      - "53217"
      - "53218"
      - "53219"
      - "53220"
      - "53317"
      - "53318"
      - "53319"
      - "53320"
    volumes:
      - v2ray-cfg:/cfg
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for /cfg/server.json..."
        i=0
        while [ ! -s /cfg/server.json ]; do
          i=$$((i+1))
          if [ $$i -ge 30 ]; then
            echo "ERROR: /cfg/server.json still empty after 30s"
            exit 1
          fi
          sleep 1
        done
        echo "Config found, starting v2ray"
        exec v2ray run -config /cfg/server.json
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1; for port in 53217 53218 53219 53220 53317 53318 53319 53320; do netstat -lnt | grep -qE \":$$port[[:space:]].*LISTEN\" || exit 1; done"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  v2ray-cfg:
