services:
  init:
    build:
      context: .
      dockerfile: Dockerfile.init
    restart: "no"
    environment:
      - V2RAY_UUID=${V2RAY_UUID}
      - V2RAY_HOST=${V2RAY_HOST:-}
      - FTP_HOST=${FTP_HOST}
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
      - FTP_PATH=${FTP_PATH}
    volumes:
      - v2ray-cfg:/cfg

  v2ray:
    build:
      context: .
      dockerfile: Dockerfile.v2ray
      pull: true
    pull_policy: build
    container_name: v2ray-all
    restart: always
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "53217:53217/tcp"
      - "53218:53218/tcp"
      - "53219:53219/tcp"
      - "53220:53220/tcp"
      - "53220:53220/udp"
    volumes:
      - v2ray-cfg:/cfg
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for /cfg/server.json..."
        i=0
        while [ ! -s /cfg/server.json ]; do
          i=$$((i+1))
          if [ $$i -ge 30 ]; then
            echo "ERROR: /cfg/server.json still empty after 30s"
            exit 1
          fi
          sleep 1
        done
        echo "Config found, starting v2ray"
        exec v2ray run -config /cfg/server.json
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1; for port in 53217 53218 53219 53220; do nc -z -w 2 127.0.0.1 $$port || exit 1; done"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  v2ray-cfg:
