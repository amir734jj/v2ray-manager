syntax = "proto3";
package v2ray.core.app.proxyman.command;

// Wire-compatible subset of V2Fly's HandlerService, User, and Any messages.
// Account field 1 is the UUID for VLESS/VMess and the password for Trojan.
message Credential { string value = 1; }
message TypedMessage {
  string type_url = 1;
  bytes value = 2;
}
message User {
  uint32 level = 1;
  string email = 2;
  TypedMessage account = 3;
}
message AddUserOperation { User user = 1; }
message RemoveUserOperation { string email = 1; }
message AlterInboundRequest {
  string tag = 1;
  TypedMessage operation = 2;
}
message AlterInboundResponse {}

// StatsService uses the same wire fields, with its own gRPC service path.
message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
}
message StatCounter {
  string name = 1;
  int64 value = 2;
}
message QueryStatsResponse { repeated StatCounter stat = 1; }
message SysStatsRequest {}
message SysStatsResponse { uint32 uptime = 10; }
