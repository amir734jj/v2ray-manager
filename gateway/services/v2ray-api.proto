syntax = "proto3";
package v2ray.core.app.proxyman.command;

// Wire-compatible subset of V2Fly's HandlerService, User, and Any messages.
// Account field 1 is the UUID for VLESS/VMess and the password for Trojan.
message Credential { string value = 1; }
message TypedMessage {
  string type_url = 1;
  bytes value = 2;
}
message User {
  uint32 level = 1;
  string email = 2;
  TypedMessage account = 3;
}
message AddUserOperation { User user = 1; }
message RemoveUserOperation { string email = 1; }
message AlterInboundRequest {
  string tag = 1;
  TypedMessage operation = 2;
}
message AlterInboundResponse {}

message AddInboundRequest { InboundHandlerConfig inbound = 1; }
message AddInboundResponse {}
message RemoveInboundRequest { string tag = 1; }
message RemoveInboundResponse {}
message InboundHandlerConfig {
  string tag = 1;
  TypedMessage receiver_settings = 2;
  TypedMessage proxy_settings = 3;
}
message PortRange {
  uint32 from = 1;
  uint32 to = 2;
}
message IPOrDomain { bytes ip = 1; }
message ReceiverConfig {
  PortRange port_range = 1;
  IPOrDomain listen = 2;
  StreamConfig stream_settings = 4;
  SniffingConfig sniffing_settings = 8;
}
message StreamConfig {
  repeated TransportConfig transport_settings = 2;
  string protocol_name = 5;
}
message TransportConfig {
  TypedMessage settings = 2;
  string protocol_name = 3;
}
message WebSocketConfig { string path = 2; }
message SniffingConfig {
  bool enabled = 1;
  repeated string destination_override = 2;
}
message ShadowsocksAccount {
  string password = 1;
  uint32 cipher_type = 2;
}
message ShadowsocksServerConfig { User user = 2; }

// StatsService uses the same wire fields, with its own gRPC service path.
message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
}
message StatCounter {
  string name = 1;
  int64 value = 2;
}
message QueryStatsResponse { repeated StatCounter stat = 1; }
message SysStatsRequest {}
message SysStatsResponse { uint32 uptime = 10; }

// LoggerService uses its own package and a server-streaming RPC.
message FollowLogRequest {}
message FollowLogResponse { string message = 1; }
