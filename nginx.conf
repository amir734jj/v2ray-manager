map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 53217;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /vless {
        proxy_pass http://core:53217;
        include /etc/nginx/proxy_params_ws;
    }

    location = /vmess {
        proxy_pass http://core:53218;
        include /etc/nginx/proxy_params_ws;
    }

    location = /trojan {
        proxy_pass http://core:53219;
        include /etc/nginx/proxy_params_ws;
    }

    location = /shadowsocks {
        proxy_pass http://core:53220;
        include /etc/nginx/proxy_params_ws;
    }

    location / {
        return 404;
    }
}
